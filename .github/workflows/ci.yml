name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testy (jednostkowe, architektura, API)
        run: dotnet test
      - name: Mutation testing (Stryker)
        run: |
          dotnet tool restore
          dotnet stryker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker
          path: StrykerOutput/**/reports
