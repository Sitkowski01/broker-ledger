name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testy (jednostkowe, wlasnosci, architektura, integracyjne z PostgreSQL, e2e API)
        run: dotnet test
      - name: Mutation testing domeny (Stryker)
        run: |
          dotnet tool restore
          dotnet stryker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-domain
          path: StrykerOutput/**/reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Architektura frontu (dependency-cruiser)
        run: npm run arch
      - name: Build produkcyjny
        run: npx ng build
      - name: Testy jednostkowe (Vitest)
        run: npx ng test --watch=false

  mutation-infrastructure:
    # Osobno, bo kazdy przebieg testow stawia kontener PostgreSQL — trwa kilka minut.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Mutation testing warstwy bazy (Stryker + Testcontainers)
        run: |
          dotnet tool restore
          dotnet stryker -f stryker-infrastructure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-infrastructure
          path: StrykerOutput/**/reports

  mutation-api:
    # Mutanty API sprawdzaja testy e2e (cala aplikacja na PostgreSQL) — najdluzszy job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Mutation testing API (Stryker + testy e2e)
        run: |
          dotnet tool restore
          dotnet stryker -f stryker-api.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-api
          path: StrykerOutput/**/reports
