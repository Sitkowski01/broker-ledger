<a class="skip" href="#tresc">Przejdź do treści</a>
<div class="grid-bg" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<bl-ticker [items]="quotes()" />

<header>
  <div class="inner">
    <a routerLink="/" class="brand" aria-label="Broker Ledger — pulpit"><bl-logo /></a>
    <nav aria-label="Główna">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="on"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          ariaCurrentWhenActive="page"
          >{{ link.label }}</a
        >
      }
    </nav>
    <div class="user">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="email num">{{ email() }}</span>
      <button type="button" class="ghost" (click)="logout()" aria-label="Wyloguj">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" /></svg>
        <span class="hide-sm">Wyloguj</span>
      </button>
    </div>
  </div>
</header>

<main id="tresc">
  <router-outlet />
</main>

<footer>
  <div class="inner">
    <span class="credit">Projekt demonstracyjny</span>
  </div>
</footer>
