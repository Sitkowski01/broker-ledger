server {
  listen 80;
  root /usr/share/nginx/html;

  # Aplikacja jednostronicowa: kazda sciezka bez pliku (np. /ksiega po odswiezeniu) dostaje index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Pliki z hashem w nazwie mozna trzymac w cache dlugo — nowa wersja ma inna nazwe.
  location ~* \.(js|css|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Strumien zdarzen (SSE): bez buforowania i bez zamykania cichego polaczenia po 60 s.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
